<!--
  Favicon: the figure from the studio's mark, alone.

  The signature is the more distinctive half of the lockup and the wrong half
  for this job — at 16px a hairline script collapses into a grey smudge. The
  figure keeps a readable silhouette all the way down, so the tab carries that
  and the strokes are thickened to survive the reduction.
-->
